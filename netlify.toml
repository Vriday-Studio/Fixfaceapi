# build section stays as-is
[build]
  command = "npm run build"
  publish = "dist"

# production webhook proxy (keep this)
[[redirects]]
  from   = "/api/n8n/*"
  to     = "https://n8n.srv954455.hstgr.cloud/webhook/:splat"
  status = 200
  force  = true

# test webhook proxy (ADD this)
[[redirects]]
  from   = "/api/n8n-test/*"
  to     = "https://n8n.srv954455.hstgr.cloud/webhook-test/:splat"
  status = 200
  force  = true

# CORS headers for both proxy paths (optional but safe)
[[headers]]
  for = "/api/n8n/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/api/n8n-test/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"