# Build settings (keep your existing ones if you already have them)
[build]
  command = "npm run build"
  publish = "dist"

# Proxy: your site /api/n8n/* -> n8n /webhook/* (production webhook)
[[redirects]]
  from = "/api/n8n/*"
  to = "https://n8n.srv954455.hstgr.cloud/webhook/:splat"
  status = 200
  force = true
  headers = {
    Access-Control-Allow-Origin = "*",
    Access-Control-Allow-Headers = "*",
    Access-Control-Allow-Methods = "POST, OPTIONS"
  }