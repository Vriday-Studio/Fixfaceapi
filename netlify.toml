[build]
  command = "npm run build"
  publish = "dist"

# --- PRODUCTION camera endpoints (specific first) ---
# Catch-all production proxy for any other n8n webhook
 [[redirects]]
  from = "/api/n8n/*"
  to   = "https://n8n.srv954455.hstgr.cloud/webhook-test/:splat"
  status = 200
  force  = true

# --- headers ---
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# CORS (usually unnecessary because we proxy, but harmless if preflights occur)
[[headers]]
  for = "/api/n8n/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"

[[headers]]
  for = "/api/n8n-test/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Headers = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"