[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/api/n8n/*"
  to     = "https://n8n.srv954455.hstgr.cloud/webhook/:splat"
  status = 200
  force  = true

  [[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/labels/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"